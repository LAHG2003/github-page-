<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes Sociales | Tacos El Amigo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: #000;
    }

    .shape {
      position: absolute;
      opacity: 0.22;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .square {
      border: 2px solid rgba(255,255,255,0.9);
      animation-name: floatRotate;
    }

    .triangle {
      width: 0;
      height: 0;
      border-left: 35px solid transparent;
      border-right: 35px solid transparent;
      border-bottom: 60px solid rgba(255,255,255,0.15);
      filter: drop-shadow(0 0 2px rgba(255,255,255,0.4));
      animation-name: driftSpin;
    }

    .triangle::after {
      content: "";
      position: absolute;
      left: -31px;
      top: 6px;
      width: 0;
      height: 0;
      border-left: 31px solid transparent;
      border-right: 31px solid transparent;
      border-bottom: 53px solid #000;
    }

    .circle {
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      animation-name: pulseFloat;
    }

    .diamond {
      border: 2px solid rgba(255,255,255,0.9);
      transform: rotate(45deg);
      animation-name: diamondMove;
    }

    .hex {
      width: 90px;
      height: 52px;
      border-top: 2px solid rgba(255,255,255,0.9);
      border-bottom: 2px solid rgba(255,255,255,0.9);
      animation-name: slowSpinFloat;
    }

    .hex:before,
    .hex:after {
      content: "";
      position: absolute;
      width: 64px;
      height: 64px;
      border: 2px solid rgba(255,255,255,0.9);
      transform: rotate(45deg);
      left: 11px;
    }

    .hex:before {
      top: -32px;
      clip-path: inset(0 0 50% 0);
    }

    .hex:after {
      top: 20px;
      clip-path: inset(50% 0 0 0);
    }

    .line {
      position: absolute;
      width: 220px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
      transform-origin: center;
      animation-name: lineMove;
    }

    .cross {
      width: 70px;
      height: 70px;
      animation-name: spinScale;
    }

    .cross::before,
    .cross::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.9);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .cross::before {
      width: 2px;
      height: 70px;
    }

    .cross::after {
      width: 70px;
      height: 2px;
    }

    .ring {
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      box-shadow: 0 0 0 8px rgba(255,255,255,0.04);
      animation-name: pulseFloat;
    }

    .tiny {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.8);
      animation-name: miniMove;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 0 20px rgba(255,255,255,0.06);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
    }

    p {
      margin-bottom: 25px;
      color: #e5e7eb;
      line-height: 1.5;
    }

    .social-btn {
      display: block;
      width: 100%;
      text-decoration: none;
      color: white;
      padding: 16px 18px;
      margin: 12px 0;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }

    .social-btn:hover {
      transform: scale(1.03);
      opacity: 0.95;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .instagram { background: #E1306C; }
    .facebook  { background: #1877F2; }
    .tiktok    { background: #111111; border: 1px solid rgba(255,255,255,0.2); }
    .whatsapp  { background: #25D366; }

    .footer {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #d1d5db;
    }

    @keyframes floatRotate {
      0% { transform: translateY(0) translateX(0) rotate(0deg); }
      50% { transform: translateY(-90px) translateX(40px) rotate(180deg); }
      100% { transform: translateY(0) translateX(0) rotate(360deg); }
    }

    @keyframes driftSpin {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(70px, -110px) rotate(180deg); }
      100% { transform: translate(0, 0) rotate(360deg); }
    }

    @keyframes pulseFloat {
      0% { transform: scale(1) translateY(0); opacity: 0.12; }
      50% { transform: scale(1.35) translateY(-70px); opacity: 0.35; }
      100% { transform: scale(1) translateY(0); opacity: 0.12; }
    }

    @keyframes diamondMove {
      0% { transform: rotate(45deg) translate(0, 0); }
      50% { transform: rotate(225deg) translate(50px, -70px); }
      100% { transform: rotate(405deg) translate(0, 0); }
    }

    @keyframes slowSpinFloat {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-55px) rotate(180deg); }
      100% { transform: translateY(0) rotate(360deg); }
    }

    @keyframes lineMove {
      0% { transform: translateX(0) rotate(0deg); opacity: 0.08; }
      50% { transform: translateX(100px) rotate(25deg); opacity: 0.35; }
      100% { transform: translateX(0) rotate(0deg); opacity: 0.08; }
    }

    @keyframes spinScale {
      0% { transform: rotate(0deg) scale(1); opacity: 0.15; }
      50% { transform: rotate(180deg) scale(1.25); opacity: 0.35; }
      100% { transform: rotate(360deg) scale(1); opacity: 0.15; }
    }

    @keyframes miniMove {
      0% { transform: translate(0,0) rotate(0deg); opacity: 0.12; }
      50% { transform: translate(30px,-40px) rotate(180deg); opacity: 0.35; }
      100% { transform: translate(0,0) rotate(360deg); opacity: 0.12; }
    }
  </style>
