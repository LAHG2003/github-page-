<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes Sociales | Mi Empresa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
    }

    p {
      margin-bottom: 25px;
      color: #dbeafe;
      line-height: 1.5;
    }

    .social-btn {
      display: block;
      width: 100%;
      text-decoration: none;
      color: white;
      padding: 16px 18px;
      margin: 12px 0;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .social-btn:hover {
      transform: scale(1.02);
      opacity: 0.92;
    }

    .instagram { background: #E1306C; }
    .facebook  { background: #1877F2; }
    .tiktok    { background: #111111; }
    .whatsapp  { background: #25D366; }
    .web       { background: #f59e0b; color: #111; }

    .footer {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🚀</div>
    <h1>Mi Empresa</h1>
    <p>Síguenos en nuestras redes sociales y ponte en contacto con nosotros.</p>

    <a class="social-btn instagram" href="https://instagram.com/tuusuario" target="_blank">
      Instagram
    </a>

    <a class="social-btn facebook" href="https://facebook.com/tuusuario" target="_blank">
      Facebook
    </a>

    <a class="social-btn tiktok" href="https://tiktok.com/@tuusuario" target="_blank">
      TikTok
    </a>

    <a class="social-btn whatsapp" href="https://wa.me/5215512345678" target="_blank">
      WhatsApp
    </a>

    <a class="social-btn web" href="https://tusitio.com" target="_blank">
      Sitio web
    </a>

    <div class="footer">© 2026 Mi Empresa</div>
  </div>
</body>
</html>
